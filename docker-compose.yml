services:
  # 1. Backend Service Container (FastAPI + Python + SQLAlchemy)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ride-ai-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./ride_ai.db}
      - LLM_SERVICE_URL=http://llm-service:8001
    volumes:
      - ./backend/ride_ai.db:/app/ride_ai.db
    depends_on:
      - llm-service
    networks:
      - ride-ai-network

  # 2. Frontend Service Container (React + TypeScript + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ride-ai-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    depends_on:
      - backend
    networks:
      - ride-ai-network

  # 3. LLM Service Container (FastAPI + Ollama Gemma2 Integration)
  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: ride-ai-llm-service
    ports:
      - "${LLM_SERVICE_PORT:-8001}:8001"
    environment:
      - PORT=8001
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ride-ai-network

networks:
  ride-ai-network:
    driver: bridge
