services:
  # 1. Backend Service Container (FastAPI + Python + SQLAlchemy)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ride-ai-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./ride_ai.db}
    volumes:
      - ./backend/ride_ai.db:/app/ride_ai.db
    networks:
      - ride-ai-network

  # 2. Frontend Service Container (React + TypeScript + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ride-ai-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    depends_on:
      - backend
    networks:
      - ride-ai-network

networks:
  ride-ai-network:
    driver: bridge
